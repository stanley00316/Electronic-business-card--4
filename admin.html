<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- Sentry 錯誤監控 SDK -->
  <script src="https://browser.sentry-cdn.com/7.100.0/bundle.min.js" crossorigin="anonymous"></script>
  <title>NFC 名片管理後台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css?v=20260205">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="數位身分">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <style>
    body { padding: 20px; padding-bottom: 100px; max-width: 1200px; margin: 0 auto; background: #111; color: #fff; }
    h1 { color: var(--uvaco-green); margin-bottom: 30px; }
    .toolbar { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
    .toolbar-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    input[type="text"] { padding: 10px; border-radius: 8px; border: 1px solid #444; background: #222; color: #fff; width: 100%; box-sizing: border-box; }
    
    .table-wrap{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;border-radius:12px}
    table { width: 100%; min-width: 860px; border-collapse: collapse; background: #222; border-radius: 12px; overflow: hidden; }
    th, td { padding: 15px; text-align: left; border-bottom: 1px solid #333; vertical-align: top; }
    th { background: #333; color: #aaa; font-weight: normal; }
    tr:hover { background: #2a2a2a; }
    
    .btn { padding: 6px 12px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; margin-right: 5px; white-space: nowrap; width: auto; }
    .btn-green { background: var(--uvaco-green); color: #fff; }
    .btn-outline { background: transparent; border: 1px solid #555; color: #ccc; }

    /* 長網址不要撐爆版面 */
    .nfc-url-cell a{color:#9ca3af;text-decoration:none;word-break:break-all;overflow-wrap:anywhere}
    .actions-cell{white-space:normal}
    .actions-cell .actions-wrap{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}

    /* 小螢幕：表格轉卡片列表（UX：避免超出畫面、欄名直排）
       注意：同時提供 media query 與 body class（admin-narrow），避免某些環境 media query 沒吃到 */
    @media (max-width: 900px){
      body{padding:14px;padding-bottom:100px}
      table{min-width:0}
      #userTable thead{display:none !important}
      #userTable tbody{display:block}
      #userTable tbody tr{display:block;background:#1f1f1f;border:1px solid #2b2b2b;border-radius:14px;padding:12px;margin:12px 0}
      #userTable tbody td{display:flex !important;gap:10px;padding:8px 0;border:none;align-items:flex-start}
      #userTable tbody td::before{content:attr(data-label);flex:0 0 86px;color:#9ca3af;font-size:12px;font-weight:700;letter-spacing:.08em}
      #userTable tbody td.actions-cell{display:block !important}
      #userTable tbody td.actions-cell::before{content:'';display:none}
      #userTable tbody td.actions-cell .actions-wrap{justify-content:flex-start}
    }
    body.admin-narrow{padding:14px;padding-bottom:100px}
    body.admin-narrow table{min-width:0}
    body.admin-narrow #userTable thead{display:none !important}
    body.admin-narrow #userTable tbody{display:block}
    body.admin-narrow #userTable tbody tr{display:block;background:#1f1f1f;border:1px solid #2b2b2b;border-radius:14px;padding:12px;margin:12px 0}
    body.admin-narrow #userTable tbody td{display:flex !important;gap:10px;padding:8px 0;border:none;align-items:flex-start}
    body.admin-narrow #userTable tbody td::before{content:attr(data-label);flex:0 0 86px;color:#9ca3af;font-size:12px;font-weight:700;letter-spacing:.08em}
    body.admin-narrow #userTable tbody td.actions-cell{display:block !important}
    body.admin-narrow #userTable tbody td.actions-cell::before{content:'';display:none}
    body.admin-narrow #userTable tbody td.actions-cell .actions-wrap{justify-content:flex-start}
    
    .qr-modal { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); display:none; justify-content:center; align-items:center; z-index:999; }
    .qr-box { background:#fff; padding:30px; border-radius:16px; text-align:center; color:#000; }
    #qrImage { width: 250px; height: 250px; margin: 20px 0; }
  </style>
  <script src="supabase.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="cloud.js?v=20260414a"></script>
</head>
<body>

<h1>NFC 名片量產管理</h1>

<div class="toolbar">
  <div class="toolbar-actions">
    <button class="btn btn-green" onclick="reloadData()">重新整理</button>
    <button class="btn btn-outline" onclick="location.href='directory.html'">返回通訊錄</button>
    <button class="btn btn-outline" onclick="location.href='settings.html'">前往設定</button>
    <button class="btn btn-outline" id="companyAdminBtn" onclick="location.href='company-admin.html'" style="display:none;">⚙️ 管理企業管理員</button>
    <button class="btn btn-outline" id="subscriptionAdminBtn" onclick="toggleSubscriptionView()" style="display:none;">💎 訂閱管理</button>
    <button class="btn btn-outline" id="pricingAdminBtn" onclick="togglePricingSection()" style="display:none;">💰 價格方案</button>
  </div>
  <input type="text" id="searchInput" placeholder="搜尋姓名、公司..." onkeyup="filterTable()">
</div>

<div id="adminHint" style="margin:10px 0 18px;color:#aaa;font-size:13px"></div>

<div class="table-wrap">
<table id="userTable">
  <thead>
    <tr>
      <th>姓名</th>
      <th>公司/職稱</th>
      <th>NFC 卡片 ID</th>
      <th>更新時間</th>
      <th>NFC 網址</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody>
    <tr><td colspan="6" style="text-align:center">載入中...</td></tr>
  </tbody>
</table>
</div>

<!-- Super Admin：管理員管理 -->
<div id="adminMgmt" style="display:none;margin-top:26px;background:#1b1b1b;border:1px solid #2b2b2b;border-radius:12px;padding:16px">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
    <div style="font-size:16px;color:var(--uvaco-green);font-weight:700">管理員管理（超級管理員）</div>
    <button class="btn btn-outline" onclick="loadAdmins()">重新整理管理員列表</button>
  </div>

  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
    <input type="text" id="adminUserIdInput" placeholder="User ID (uuid)" style="flex:2;min-width:280px">
    <input type="text" id="adminCompanyInput" placeholder="管理公司（留空＝超級管理員）" style="flex:1;min-width:220px">
    <button class="btn btn-green" onclick="saveAdminUser()">新增/更新</button>
    <button class="btn btn-outline" onclick="removeAdminUser()">移除</button>
  </div>

  <div class="table-wrap">
  <table id="adminTable" style="width:100%;border-collapse:collapse;background:#222;border-radius:12px;overflow:hidden;min-width:520px">
    <thead>
      <tr>
        <th style="background:#333;color:#aaa;font-weight:normal;padding:12px;border-bottom:1px solid #333">User ID</th>
        <th style="background:#333;color:#aaa;font-weight:normal;padding:12px;border-bottom:1px solid #333">managed_company</th>
      </tr>
    </thead>
    <tbody>
      <tr><td colspan="2" style="padding:12px;text-align:center;color:#888">載入中...</td></tr>
    </tbody>
  </table>
  </div>
</div>

<!-- Super Admin：價格方案管理 -->
<div id="pricingMgmt" style="display:none;margin-top:26px;background:#1b1b1b;border:1px solid #2b2b2b;border-radius:12px;padding:16px">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px">
    <div style="font-size:16px;color:var(--uvaco-green);font-weight:700">💰 價格方案管理（超級管理員）</div>
    <button class="btn btn-outline" onclick="loadPricingPlans()">重新整理方案列表</button>
  </div>
  
  <div id="pricingList" style="margin-bottom:16px;">
    <div style="text-align:center;color:#888;padding:20px;">載入中...</div>
  </div>
  
  <div style="border-top:1px solid #333;padding-top:16px;margin-top:16px;">
    <div style="font-size:14px;color:#9ca3af;margin-bottom:12px;">新增/編輯方案</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <input type="hidden" id="pricingPlanId">
      <input type="text" id="pricingNameInput" placeholder="方案名稱（中文）" style="flex:1;min-width:150px">
      <input type="text" id="pricingNameEnInput" placeholder="方案名稱（英文）" style="flex:1;min-width:150px">
      <input type="number" id="pricingPriceInput" placeholder="價格（元）" style="width:120px">
      <input type="number" id="pricingDaysInput" placeholder="天數" style="width:100px">
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px">
      <input type="text" id="pricingDescInput" placeholder="說明（中文）" style="flex:1;min-width:200px">
      <input type="text" id="pricingDescEnInput" placeholder="說明（英文）" style="flex:1;min-width:200px">
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-green" onclick="savePricingPlan()">儲存方案</button>
      <button class="btn btn-outline" onclick="clearPricingForm()">清除</button>
    </div>
  </div>
</div>

<div id="qrModal" class="qr-modal" onclick="this.style.display='none'">
  <div class="qr-box" onclick="event.stopPropagation()">
    <h3 id="qrName"></h3>
    <div id="qrcode"></div>
    <p>請掃描或截圖提供給印刷廠</p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:15px;">
      <button class="btn btn-green" onclick="downloadQR()">下載 QR Code</button>
      <button class="btn btn-outline" onclick="document.getElementById('qrModal').style.display='none'">關閉</button>
    </div>
  </div>
</div>

<!-- NFC 卡片 ID 編輯彈窗 -->
<div id="nfcModal" class="qr-modal" onclick="this.style.display='none'">
  <div class="qr-box" onclick="event.stopPropagation()" style="max-width:400px;">
    <h3 id="nfcModalTitle">綁定 NFC 卡片</h3>
    <p style="color:#9ca3af;font-size:13px;margin-bottom:16px;">輸入實體 NFC 卡片上的編號，用於識別此用戶</p>
    <input type="text" id="nfcIdInput" placeholder="例如：NFC001" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#1b1b1b;color:#fff;font-family:monospace;font-size:14px;box-sizing:border-box;">
    <input type="hidden" id="nfcTargetUserId">
    <p style="color:#6b7280;font-size:12px;margin-top:12px;">
      NFC 卡片連結格式：<br>
      <code style="color:#22c55e;">card.html?nfc=NFC001</code>
    </p>
    <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;">
      <button class="btn btn-green" onclick="saveNfcId()">儲存</button>
      <button class="btn btn-outline" onclick="clearNfcId()">清除綁定</button>
      <button class="btn btn-outline" onclick="document.getElementById('nfcModal').style.display='none'">取消</button>
    </div>
  </div>
</div>

<!-- 訂閱延長彈窗 -->
<div id="subscriptionModal" class="qr-modal" onclick="this.style.display='none'">
  <div class="qr-box" onclick="event.stopPropagation()" style="max-width:450px;">
    <h3 id="subModalTitle">延長訂閱</h3>
    <div id="subUserInfo" style="color:#9ca3af;font-size:13px;margin-bottom:16px;"></div>
    
    <div style="margin-bottom:16px;">
      <label id="subDaysLabel" style="display:block;color:#9ca3af;font-size:13px;margin-bottom:6px;">延長天數</label>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn btn-outline" onclick="setExtendDays(30)">30 天</button>
        <button class="btn btn-outline" onclick="setExtendDays(90)">90 天</button>
        <button class="btn btn-outline" onclick="setExtendDays(180)">半年</button>
        <button class="btn btn-outline" onclick="setExtendDays(365)">一年</button>
      </div>
      <input type="number" id="extendDaysInput" placeholder="自訂天數" min="1" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#1b1b1b;color:#fff;font-size:14px;box-sizing:border-box;margin-top:10px;">
    </div>
    
    <div style="margin-bottom:16px;">
      <label id="subReasonLabel" style="display:block;color:#9ca3af;font-size:13px;margin-bottom:6px;">延長原因（選填）</label>
      <input type="text" id="extendReasonInput" placeholder="例如：VIP 客戶優惠" style="width:100%;padding:12px;border-radius:8px;border:1px solid #333;background:#1b1b1b;color:#fff;font-size:14px;box-sizing:border-box;">
    </div>
    
    <input type="hidden" id="subTargetUserId">
    
    <div style="display:flex;gap:10px;justify-content:center;margin-top:20px;">
      <button class="btn btn-green" onclick="confirmExtendSubscription()">確認延長</button>
      <button class="btn btn-outline" onclick="document.getElementById('subscriptionModal').style.display='none'">取消</button>
    </div>
  </div>
</div>

<script>
let allData = [];
let adminStatus = null;

function applyResponsiveAdminLayout() {
  try {
    const narrow = (window.innerWidth || 0) <= 900;
    document.body.classList.toggle('admin-narrow', !!narrow);
  } catch (e) {}
}

async function init() {
  applyResponsiveAdminLayout();
  window.addEventListener('resize', applyResponsiveAdminLayout);
  // 1. 檢查登入
  const { session } = await UVACO_CLOUD.getSession();
  if (!session) {
    window.location.href = 'auth.html?next=admin.html';
    return;
  }

  // 2. 檢查權限
  adminStatus = await UVACO_CLOUD.isAdmin();
  if (!adminStatus || !adminStatus.isAdmin) {
    alert('權限不足：您不是管理員。');
    window.location.href = 'directory.html';
    return;
  }

  // 顯示管理員提示（超級管理員 / 企業管理員）
  const hint = document.getElementById('adminHint');
  if (hint) {
    if (adminStatus.canManageAdmins) {
      hint.textContent = '目前身分：超級管理員（可管理全部名片與管理員名單）';
    } else if (!adminStatus.managedCompany) {
      hint.textContent = '目前身分：超級管理員（可管理全部名片）';
    } else {
      hint.textContent = `目前身分：企業管理員（只顯示公司包含「${adminStatus.managedCompany}」的名片）`;
    }
  }

  // 只有 canManageAdmins 為 true 才顯示管理員管理區（需在 admin_allowlist 中）
  const mgmt = document.getElementById('adminMgmt');
  if (mgmt) {
    mgmt.style.display = adminStatus.canManageAdmins ? 'block' : 'none';
  }
  
  // 只有 canManageAdmins 為 true 才顯示「管理企業管理員」按鈕
  const companyAdminBtn = document.getElementById('companyAdminBtn');
  if (companyAdminBtn) {
    companyAdminBtn.style.display = adminStatus.canManageAdmins ? 'inline-block' : 'none';
  }
  
  // Super Admin（canManageAdmins）才顯示「訂閱管理」按鈕
  const subscriptionAdminBtn = document.getElementById('subscriptionAdminBtn');
  if (subscriptionAdminBtn) {
    subscriptionAdminBtn.style.display = adminStatus.canManageAdmins ? 'inline-block' : 'none';
  }
  
  // Super Admin（canManageAdmins）才顯示「價格方案」按鈕
  const pricingAdminBtn = document.getElementById('pricingAdminBtn');
  if (pricingAdminBtn) {
    pricingAdminBtn.style.display = adminStatus.canManageAdmins ? 'inline-block' : 'none';
  }

  await reloadData();
  if (adminStatus.canManageAdmins) {
    await loadAdmins();
    await loadPricingPlans();
  }
}

async function reloadData() {
  const { rows } = await UVACO_CLOUD.getAllCardsAdmin();
  // 批次向資料庫取得「他人開啟」統計，合併後再渲染表格
  const ids = list.map((r) => r.user_id).filter(Boolean);
  // 批次向資料庫取得「他人開啟」統計，合併後再渲染表格
  let statsMap = new Map();
  if (typeof UVACO_CLOUD.getCardViewSummariesForAdmin === 'function') {
    statsMap = await UVACO_CLOUD.getCardViewSummariesForAdmin(ids);
  }
  list.forEach((r) => {
    const s = statsMap.get(String(r.user_id));
    r._viewOpenCount = s ? s.openCount : 0;
    r._viewLastOpenedAt = s ? s.lastOpenedAt : null;
  });
  allData = list;
  renderTable(allData);
}

function renderTable(data) {
  // #region agent log
  fetch('http://127.0.0.1:7665/ingest/1c4657e8-8c04-4e63-85b8-af5c9905415e',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'acea73'},body:JSON.stringify({sessionId:'acea73',location:'admin.html:renderTable',message:'renderTable 被呼叫（名片列表）',data:{rowCount:data.length,showSubscriptionView:typeof showSubscriptionView!=='undefined'?showSubscriptionView:null,firstIsCardShape:!!(data[0]&&('name'in data[0]||'nfc_card_id'in data[0]))},timestamp:Date.now(),hypothesisId:'A'})}).catch(()=>{});
  // #endregion
  const tbody = document.querySelector('#userTable tbody');
  tbody.innerHTML = '';
  
  if (data.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center">目前沒有資料</td></tr>';
    return;
  }

  data.forEach(row => {
    const url = `${window.location.origin}${window.location.pathname.replace('admin.html', '')}card.html?id=${row.user_id}`;
    const urlLabel = `card.html?id=${row.user_id}`;
    const nfcId = row.nfc_card_id || '';
    const nfcDisplay = nfcId ? `<span style="color:#22c55e;font-family:monospace;">${nfcId}</span>` : '<span style="color:#6b7280;">未綁定</span>';
    
    const vCount = typeof row._viewOpenCount === 'number' ? row._viewOpenCount : 0;
    const vLast = row._viewLastOpenedAt
      ? new Date(row._viewLastOpenedAt).toLocaleString('zh-TW')
      : '尚無紀錄';
    const nameSub = `<br><small style="color:#9ca3af">最後開啟（他人）：${vLast}</small><br><small style="color:#9ca3af">次數：${vCount}</small>`;
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td data-label="姓名">${row.name || '未命名'}${nameSub}</td>
      <td data-label="公司/職稱">${row.company || '-'} <br> <small style="color:#9ca3af">${row.title || '-'}</small></td>
      <td data-label="NFC 卡片 ID">
        ${nfcDisplay}
        <button class="btn btn-outline" style="padding:4px 8px;font-size:11px;margin-left:8px;" onclick="editNfcId('${row.user_id}', '${nfcId}', '${(row.name || '').replace(/'/g, "\\'")}')">
          ${nfcId ? '修改' : '綁定'}
        </button>
      </td>
      <td data-label="更新時間">${new Date(row.updated_at).toLocaleDateString()}</td>
      <td data-label="NFC 網址" class="nfc-url-cell"><a href="${url}" target="_blank" rel="noopener noreferrer">${urlLabel}</a></td>
      <td class="actions-cell">
        <div class="actions-wrap">
          <button class="btn btn-green" onclick="copyLink('${url}')">複製連結</button>
          <button class="btn btn-outline" onclick="showQR('${row.name}', '${url}')">QR Code</button>
          <button class="btn btn-outline" onclick="editCard('${row.user_id}')">編輯</button>
          <button class="btn btn-outline" onclick="deleteCard('${row.user_id}')">刪除</button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function filterTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  // #region agent log
  fetch('http://127.0.0.1:7665/ingest/1c4657e8-8c04-4e63-85b8-af5c9905415e',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'acea73'},body:JSON.stringify({sessionId:'acea73',location:'admin.html:filterTable',message:'filterTable entry',data:{showSubscriptionView,qLen:q.length,allDataLen:allData.length,subscriptionDataLen:subscriptionData.length,runId:'post-fix'},timestamp:Date.now(),hypothesisId:'B'})}).catch(()=>{});
  // #endregion

  // 依目前畫面模式分開篩選：訂閱與名片列表欄位不同，不可共用 renderTable
  if (showSubscriptionView) {
    const filteredSub = subscriptionData.filter(r =>
      (r.userName && r.userName.toLowerCase().includes(q)) ||
      (r.userCompany && String(r.userCompany).toLowerCase().includes(q))
    );
    // #region agent log
    fetch('http://127.0.0.1:7665/ingest/1c4657e8-8c04-4e63-85b8-af5c9905415e',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'acea73'},body:JSON.stringify({sessionId:'acea73',location:'admin.html:filterTable',message:'subscription branch renderSubscriptionTable',data:{filteredSubRows:filteredSub.length,runId:'post-fix'},timestamp:Date.now(),hypothesisId:'A'})}).catch(()=>{});
    // #endregion
    renderSubscriptionTable(filteredSub);
    return;
  }

  const filtered = allData.filter(r => 
    (r.name && r.name.toLowerCase().includes(q)) || 
    (r.company && r.company.toLowerCase().includes(q))
  );
  // #region agent log
  fetch('http://127.0.0.1:7665/ingest/1c4657e8-8c04-4e63-85b8-af5c9905415e',{method:'POST',headers:{'Content-Type':'application/json','X-Debug-Session-Id':'acea73'},body:JSON.stringify({sessionId:'acea73',location:'admin.html:filterTable',message:'card branch before renderTable',data:{showSubscriptionView,filteredCardRows:filtered.length,runId:'post-fix'},timestamp:Date.now(),hypothesisId:'A'})}).catch(()=>{});
  // #endregion
  renderTable(filtered);
}

function copyLink(url) {

async function deleteCard(userId) {
  const ok = confirm('確定要刪除此名片嗎？此動作無法復原。');
  if (!ok) return;
  try {
    await UVACO_CLOUD.deleteCard(userId);
    await reloadData();
    alert('已刪除。');
  } catch (e) {
    try { console.error('deleteCard failed', e); } catch (_e) {}
    const msg = String(e?.message || e || '');
    const code = String(e?.code || '');
    const details = String(e?.details || '');
    const hint = String(e?.hint || '');
    const extra = [code && ('code=' + code), details && ('details=' + details), hint && ('hint=' + hint)]
      .filter(Boolean)
      .join('\n');
    // 常見：Supabase / Postgres RLS policy 自我參照，會回傳 stack depth limit exceeded
    if (/stack\s+depth\s+limit\s+exceeded/i.test(msg)) {
      alert(
        '刪除失敗：資料庫權限規則（RLS policy）可能有「自我查表」造成遞迴，導致 stack depth limit exceeded。\n\n' +
        '請到 Supabase SQL Editor 重新執行專案的 update_admin_schema.sql（最新版已修正此問題），再重試刪除。\n\n' +
        (extra ? ('\n\n' + extra) : '')
      );
      return;
    }
    alert('刪除失敗：' + msg + (extra ? ('\n\n' + extra) : ''));
  }
}

// ===== 價格方案管理功能 =====
let pricingPlans = [];

function togglePricingSection() {
  const section = document.getElementById('pricingMgmt');
  if (section) {
    const isVisible = section.style.display === 'block';
    section.style.display = isVisible ? 'none' : 'block';
    if (!isVisible) {
      loadPricingPlans();
    }
  }
}

async function loadPricingPlans() {
  const container = document.getElementById('pricingList');
  if (!container) return;
  
  container.innerHTML = '<div style="text-align:center;color:#888;padding:20px;">載入中...</div>';
  
  try {
    // 管理員查看所有方案（包含停用的）
    const result = await UVACO_CLOUD.getPricingPlans(true);
    pricingPlans = result.plans || [];
    renderPricingPlans();
  } catch (e) {
    console.error('載入價格方案失敗:', e);
    container.innerHTML = '<div style="text-align:center;color:#ef4444;padding:20px;">載入失敗</div>';
  }
}

function renderPricingPlans() {
  const container = document.getElementById('pricingList');
  if (!container) return;
  
  if (pricingPlans.length === 0) {
    container.innerHTML = '<div style="text-align:center;color:#888;padding:20px;">目前沒有價格方案</div>';
    return;
  }
  
  container.innerHTML = pricingPlans.map(plan => {
    const isInactive = !plan.is_active;
    const opacity = isInactive ? '0.5' : '1';
    const statusBadge = isInactive ? '<span style="color:#ef4444;font-size:11px;margin-left:6px;">(已停用)</span>' : '';
    
    return `
    <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:#222;border-radius:8px;margin-bottom:8px;opacity:${opacity};">
      <div style="flex:1;">
        <div style="font-weight:600;color:#e5e7eb;">${plan.name}${statusBadge}</div>
        <div style="font-size:12px;color:#9ca3af;">${plan.description || ''}</div>
      </div>
      <div style="text-align:right;">
        <div style="font-size:18px;font-weight:700;color:var(--uvaco-green);">NT$ ${Math.round(plan.price / 100)}</div>
        <div style="font-size:12px;color:#9ca3af;">${plan.duration_days} 天</div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn btn-outline" style="padding:4px 10px;font-size:12px;" onclick="editPricingPlan('${plan.id}')">編輯</button>
        ${isInactive 
          ? `<button class="btn btn-outline" style="padding:4px 10px;font-size:12px;color:#22c55e;border-color:#22c55e;" onclick="reactivatePricingPlan('${plan.id}')">啟用</button>`
          : `<button class="btn btn-outline" style="padding:4px 10px;font-size:12px;color:#ef4444;border-color:#ef4444;" onclick="deletePricingPlan('${plan.id}')">停用</button>`
        }
      </div>
    </div>
  `}).join('');
}

function editPricingPlan(planId) {
  const plan = pricingPlans.find(p => p.id === planId);
  if (!plan) return;
  
  document.getElementById('pricingPlanId').value = plan.id;
  document.getElementById('pricingNameInput').value = plan.name || '';
  document.getElementById('pricingNameEnInput').value = plan.name_en || '';
  document.getElementById('pricingPriceInput').value = Math.round(plan.price / 100); // 轉換為元
  document.getElementById('pricingDaysInput').value = plan.duration_days || '';
  document.getElementById('pricingDescInput').value = plan.description || '';
  document.getElementById('pricingDescEnInput').value = plan.description_en || '';
}

function clearPricingForm() {
  document.getElementById('pricingPlanId').value = '';
  document.getElementById('pricingNameInput').value = '';
  document.getElementById('pricingNameEnInput').value = '';
  document.getElementById('pricingPriceInput').value = '';
  document.getElementById('pricingDaysInput').value = '';
  document.getElementById('pricingDescInput').value = '';
  document.getElementById('pricingDescEnInput').value = '';
}

async function savePricingPlan() {
  const id = document.getElementById('pricingPlanId').value.trim();
  const name = document.getElementById('pricingNameInput').value.trim();
  const name_en = document.getElementById('pricingNameEnInput').value.trim();
  const price = parseInt(document.getElementById('pricingPriceInput').value) * 100; // 轉換為分
  const duration_days = parseInt(document.getElementById('pricingDaysInput').value);
  const description = document.getElementById('pricingDescInput').value.trim();
  const description_en = document.getElementById('pricingDescEnInput').value.trim();
  
  if (!name) {
    alert('請輸入方案名稱');
    return;
  }
  if (!price || price < 0) {
    alert('請輸入有效的價格');
    return;
  }
  if (!duration_days || duration_days < 1) {
    alert('請輸入有效的天數');
    return;
  }
  
  try {
    const result = await UVACO_CLOUD.savePricingPlan({
      id: id || null,
      name,
      name_en,
      price,
      duration_days,
      description,
      description_en,
      active: true
    });
    
    if (result.success) {
      alert(id ? '方案已更新' : '方案已新增');
      clearPricingForm();
      await loadPricingPlans();
    } else {
      alert('儲存失敗：' + (result.error || '未知錯誤'));
    }
  } catch (e) {
    console.error('儲存價格方案失敗:', e);
    alert('儲存失敗：' + (e.message || e));
  }
}

async function deletePricingPlan(planId) {
  if (!confirm('確定要停用此價格方案嗎？')) return;
  
  try {
    const result = await UVACO_CLOUD.deletePricingPlan(planId);
    if (result.success) {
      alert('方案已停用');
      await loadPricingPlans();
    } else {
      alert('停用失敗：' + (result.error || '未知錯誤'));

    console.error('停用價格方案失敗:', e);
    alert('停用失敗：' + (e.message || e));
  }
}

async function reactivatePricingPlan(planId) {

         ${canReduce ? `<button class="btn btn-outline" style="color:#f59e0b;border-color:#f59e0b;" onclick="openReduceModal('${row.user_id}', '${(row.userName || '').replace(/'/g, "\\'")}', ${row.daysLeft}, '${endDate}')">減少訂閱</button>` : ''}

// 這裡統一控制彈窗是延長、減少或重新啟用，避免按鈕與提示文字錯亂
function setSubscriptionModalMode(mode) {
  subscriptionModalMode = mode;
  const daysLabel = document.getElementById('subDaysLabel');
  const reasonLabel = document.getElementById('subReasonLabel');
  const daysInput = document.getElementById('extendDaysInput');
  const reasonInput = document.getElementById('extendReasonInput');
  const confirmBtn = document.querySelector('#subscriptionModal .btn-green');

  if (!daysLabel || !reasonLabel || !daysInput || !reasonInput || !confirmBtn) return;

  if (mode === 'reduce') {
    daysLabel.textContent = '減少天數';
    reasonLabel.textContent = '減少原因（選填）';
    daysInput.placeholder = '要扣除的天數';
    reasonInput.placeholder = '例如：誤加天數修正';
    confirmBtn.textContent = '確認減少';
    confirmBtn.onclick = confirmReduceSubscription;
    return;
  }

  if (mode === 'reactivate') {
    daysLabel.textContent = '啟用天數';
    reasonLabel.textContent = '啟用原因（選填）';
    daysInput.placeholder = '預設 30 天';
    reasonInput.placeholder = '例如：管理員重新啟用';
    confirmBtn.textContent = '確認啟用';
    confirmBtn.onclick = confirmReactivateSubscription;
    return;
  }

  daysLabel.textContent = '延長天數';
  reasonLabel.textContent = '延長原因（選填）';
  daysInput.placeholder = '自訂天數';
  reasonInput.placeholder = '例如：VIP 客戶優惠';
  confirmBtn.textContent = '確認延長';
  confirmBtn.onclick = confirmExtendSubscription;
}

function openReduceModal(userId, userName, daysLeft, endDate) {

  document.getElementById('extendReasonInput').value = '';

async function confirmExtendSubscription() {
  const userId = document.getElementById('subTargetUserId').value;
  const days = parseInt(document.getElementById('extendDaysInput').value);
  const reason = document.getElementById('extendReasonInput').value.trim();
  
  if (!userId) {
    alert('錯誤：找不到用戶 ID');
    return;
  }
  
  if (!days || days < 1) {
    alert('請輸入有效的延長天數');
    return;
  }
  
  try {
    const result = await UVACO_CLOUD.extendSubscription(userId, days, reason);
    if (result.success) {
      const newEnd = new Date(result.newEndDate).toLocaleDateString('zh-TW');
      alert(`訂閱已延長 ${days} 天\n新到期日：${newEnd}`);
      document.getElementById('subscriptionModal').style.display = 'none';
      loadSubscriptions();
    } else {
      alert('延長失敗：' + (result.error || '未知錯誤'));
    }
  } catch (e) {
    console.error('延長訂閱錯誤:', e);
    alert('延長失敗：' + (e.message || e));
  }
}

// 這裡是送出減少訂閱請求，扣到過期時系統會自動停用名片
async function confirmReduceSubscription() {
  const userId = document.getElementById('subTargetUserId').value;
  const days = parseInt(document.getElementById('extendDaysInput').value, 10);
  const reason = document.getElementById('extendReasonInput').value.trim();

  if (!userId) {
    alert('錯誤：找不到用戶 ID');
    return;
  }

  if (!days || days < 1) {
    alert('請輸入有效的減少天數');
    return;
  }

  try {
    const result = await UVACO_CLOUD.reduceSubscription(userId, days, reason || '管理員手動減少訂閱');
    if (result.success) {
      if (result.autoCancelled) {
        alert(`已減少 ${days} 天\n此用戶已到期，系統已自動停用並隱藏名片`);
      } else {
        const newEnd = new Date(result.newEndDate).toLocaleDateString('zh-TW');
        alert(`訂閱已減少 ${days} 天\n新到期日：${newEnd}`);
      }
      document.getElementById('subscriptionModal').style.display = 'none';
      setSubscriptionModalMode('extend');
      loadSubscriptions();
    } else {
      if (result.error === 'SUBSCRIPTION_NOT_FOUND') {
        alert('減少失敗：此用戶尚未建立訂閱紀錄');
      } else {
        alert('減少失敗：' + (result.error || '未知錯誤'));
      }
    }
  } catch (e) {
    console.error('減少訂閱錯誤:', e);
    alert('減少失敗：' + (e.message || e));
  }
}

// 停用訂閱確認
async function confirmDeactivate(userId, userName) {
  const reason = prompt(`確定要停用「${userName}」的訂閱嗎？\n\n停用後：\n- 名片將無法被外部瀏覽\n- 用戶自己仍可查看\n\n請輸入停用原因（選填）：`);
  
  if (reason === null) return; // 用戶點擊取消
  
  try {
    const result = await UVACO_CLOUD.deactivateSubscription(userId, reason || '管理員手動停用');
    if (result.success) {
      alert(`已停用「${userName}」的訂閱\n名片已設為不可見`);
      loadSubscriptions();
    } else {
      alert('停用失敗：' + (result.error || '未知錯誤'));
    }
  } catch (e) {
    console.error('停用訂閱錯誤:', e);
    alert('停用失敗：' + (e.message || e));
  }
}

// 重新啟用訂閱彈窗
function openReactivateModal(userId, userName) {
  document.getElementById('subModalTitle').textContent = (userName || '用戶') + ' - 重新啟用';
  document.getElementById('subUserInfo').innerHTML = `
    目前狀態：<strong style="color:#9ca3af;">已停用</strong><br>
    重新啟用後將恢復名片可見性
  `;
  document.getElementById('subTargetUserId').value = userId;
  document.getElementById('extendDaysInput').value = '30';
  document.getElementById('extendReasonInput').value = '';
  setSubscriptionModalMode('reactivate');
  document.getElementById('subscriptionModal').style.display = 'flex';
}

// 確認重新啟用訂閱
async function confirmReactivateSubscription() {
  const userId = document.getElementById('subTargetUserId').value;
  const days = parseInt(document.getElementById('extendDaysInput').value) || 30;
  const reason = document.getElementById('extendReasonInput').value.trim();
  
  if (!userId) {
    alert('錯誤：找不到用戶 ID');
    return;
  }
  
  try {
    const result = await UVACO_CLOUD.reactivateUserSubscription(userId, days, reason || '管理員重新啟用');
    if (result.success) {
      const newEnd = new Date(result.newEndDate).toLocaleDateString('zh-TW');
      alert(`訂閱已重新啟用\n有效期：${days} 天\n到期日：${newEnd}`);
      document.getElementById('subscriptionModal').style.display = 'none';
      setSubscriptionModalMode('extend');
      loadSubscriptions();
    } else {
      alert('啟用失敗：' + (result.error || '未知錯誤'));
    }
  } catch (e) {
    console.error('重新啟用錯誤:', e);
    alert('啟用失敗：' + (e.message || e));
  }
}

// 修改原本的 reloadData 函數
const originalReloadData = reloadData;
reloadData = async function() {
  if (showSubscriptionView) {
    await loadSubscriptions();
  } else {
    // 恢復原本的表頭
    const thead = document.querySelector('#userTable thead tr');
    thead.innerHTML = `
      <th>姓名</th>
      <th>公司/職稱</th>
      <th>NFC 卡片 ID</th>
      <th>更新時間</th>
      <th>NFC 網址</th>
      <th>操作</th>
    `;
    await originalReloadData();
  }
};

init();
</script>

<script>
// 前往「我的名片」頁面
async function gotoMyCard(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  try {
    if (!window.UVACO_CLOUD || !UVACO_CLOUD.hasConfig()) {
      window.location.href = 'auth.html?next=admin.html';
      return false;
    }
    const s = await UVACO_CLOUD.getSession();
    const uid = s && s.session && s.session.user ? String(s.session.user.id || '').trim() : '';
    if (!uid) {
      window.location.href = 'auth.html?next=admin.html';
      return false;
    }
    window.location.href = 'card.html?id=' + encodeURIComponent(uid);
    return false;
  } catch (e) {
    window.location.href = 'auth.html?next=admin.html';
    return false;
  }
}
</script>
