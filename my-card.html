<head>
  <meta charset="UTF-8" />

  <title>我的名片 - 數位身分平台</title>
  <!-- 預連線加速載入 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://nqxibryjhgftyxttopuo.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://nqxibryjhgftyxttopuo.supabase.co">
  <link rel="stylesheet" href="styles.css?v=20260610a">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json" id="uvacoManifestLink">
  <script>
    // Android 用「加入主畫面」建立捷徑時，並不是記住當下網址，而是永遠改用
    // App 資訊清單（manifest.json）裡固定寫死的進入頁面，導致網址上帶的
    // 名片編號（?id=）被忽略、捷徑變回沒有編號的舊版、又要重新登入。
    // 這裡在畫面載入的當下，把 manifest 動態換成「進入頁面已經包含這組編號」的版本，
    // Android 之後不管用哪種安裝方式記住捷徑，都會保留這組編號。
    //
    // 但實測發現：iOS Safari 的「加入主畫面」一樣是看 manifest 裡固定寫死的
    // 進入頁面，卻「不會」套用我們這裡用程式動態換掉的內容（這個換法只有
    // Android/Chrome 系瀏覽器支援）。iOS 上這份清單沒辦法個人化，與其讓它
    // 錯誤地导向沒有編號的頁面，不如乾脆把清單參照整個拿掉——這樣 iOS 會
    // 退回蘋果自己另一套更早期、只認「目前網址」＋畫面上 apple-mobile-web-app
    // 標籤的加入主畫面方式，網址上的編號才能確實被保留下來。
    (function () {
      try {
        var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent || '');
        var link = document.getElementById('uvacoManifestLink');
        if (isIOS) {
          if (link) link.remove();
          return;
        }
        var params = new URLSearchParams(window.location.search || '');
        var id = params.get('id');
        if (!id || !/^[A-Za-z0-9_-]{1,80}$/.test(id)) return;
        fetch('manifest.json')
          .then(function (res) { return res.json(); })
          .then(function (manifest) {
            manifest.start_url = 'my-card.html?id=' + encodeURIComponent(id);
            var blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
            if (link) link.setAttribute('href', URL.createObjectURL(blob));
          })
          .catch(function () {});
      } catch (e) {}
    })();
  </script>
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="我的名片">

  <style>
    body {
      display: flex;

      margin: 0;

      color: #fff;

    .loading {
      text-align: center;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(34, 197, 94, 0.3);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }
    .loading-text a {
      color: #22c55e;
      text-decoration: underline;
    }
    .loading-text a:hover {
      color: #16a34a;
    }
    .loading.needs-login .loading-spinner {
      display: none;
    }
    .login-once-link {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: #22c55e;
      color: #fff !important;
      text-decoration: none !important;
      font-weight: 700;
    }
    .login-once-link:hover {
      background: #16a34a;
    }
  </style>

</head>
