<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的名片 - 數位身分平台</title>
  <!-- 預連線加速載入 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="preconnect" href="https://nqxibryjhgftyxttopuo.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
  <link rel="dns-prefetch" href="https://nqxibryjhgftyxttopuo.supabase.co">
  <link rel="stylesheet" href="styles.css?v=20260610a">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="我的名片">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: #0f172a;
      color: #fff;
    }
    .loading {
      text-align: center;
    }
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(34, 197, 94, 0.3);
      border-top-color: #22c55e;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      color: #9ca3af;
      font-size: 14px;
      line-height: 1.6;
    }
    .loading-text a {
      color: #22c55e;
      text-decoration: underline;
    }
    .loading-text a:hover {
      color: #16a34a;
    }
    .loading.needs-login .loading-spinner {
      display: none;
    }
    .login-once-link {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 999px;
      background: #22c55e;
      color: #fff !important;
      text-decoration: none !important;
      font-weight: 700;
    }
    .login-once-link:hover {
      background: #16a34a;
    }
  </style>
  <script src="supabase.min.js"></script>
  <script src="cloud.js?v=20260610a"></script>
</head>
<body class="theme-dark">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">正在載入您的名片...</div>
  </div>

  <script type="module" src="js/pages/my-card/main.js?v=20260706a"></script>
</body>
</html>
