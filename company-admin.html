<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <!-- Sentry 錯誤監控 SDK -->
  <script src="https://browser.sentry-cdn.com/7.100.0/bundle.min.js" crossorigin="anonymous"></script>
  <title>企業管理員設定 - 數位身分平台</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css?v=20260610a">
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#22c55e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="數位身分">
  <link rel="apple-touch-icon" href="icon-192.svg">
  <style>
    body { padding: 20px; padding-bottom: 100px; max-width: 900px; margin: 0 auto; background: #111; color: #fff; }
    h1 { color: var(--uvaco-green); margin-bottom: 10px; font-size: 24px; }
    .subtitle { color: #9ca3af; font-size: 14px; margin-bottom: 30px; }
    
    .toolbar { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .btn { padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-green { background: var(--uvaco-green); color: #fff; }
    .btn-green:hover { background: #1ea05a; }
    .btn-outline { background: transparent; border: 1px solid #444; color: #ccc; }
    .btn-outline:hover { background: rgba(255,255,255,0.05); border-color: #666; }
    .btn-red { background: #dc2626; color: #fff; }
    .btn-red:hover { background: #b91c1c; }
    
    /* 統計卡片 */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
      margin-bottom: 30px;
    }
    .stat-card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
    }
    .stat-icon { font-size: 28px; margin-bottom: 8px; }
    .stat-value { font-size: 32px; font-weight: 800; color: var(--uvaco-green); }
    .stat-label { font-size: 13px; color: #9ca3af; margin-top: 4px; }
    
    /* 區塊 */
    .section {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
    }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* 表單 */
    .form-group { margin-bottom: 16px; }
    .form-label {
      display: block;
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 6px;
    }
    .form-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--uvaco-green);
    }
    .form-hint {
      font-size: 12px;
      color: #6b7280;
      margin-top: 6px;
    }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 600px) {
      .form-row { grid-template-columns: 1fr; }
    }
    
    /* 管理員列表 */
    .admin-list { display: flex; flex-direction: column; gap: 12px; }
    .admin-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #222;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 16px;
      gap: 16px;
    }
    .admin-item:hover { border-color: #444; }
    .admin-info { flex: 1; min-width: 0; }
    .admin-type {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    .admin-type.super { color: #fbbf24; }
    .admin-type.company { color: #60a5fa; }
    .admin-userid {
      font-family: monospace;
      font-size: 12px;
      color: #9ca3af;
      word-break: break-all;
    }
    .admin-actions { display: flex; gap: 8px; flex-shrink: 0; }
    .admin-actions .btn { padding: 8px 12px; font-size: 13px; }
    
    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #6b7280;
    }
    .empty-state-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
    .empty-state-text { font-size: 14px; }
    
    /* 載入中 */
    .loading { text-align: center; padding: 40px; color: #9ca3af; }
    
    /* 錯誤訊息 */
    .error-msg {
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.3);
      color: #ef4444;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    
    /* 成功訊息 */
    .success-msg {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    
    /* 人員選擇器 */
    .user-picker { position: relative; }
    .user-picker-dropdown {
      position: absolute;
      top: calc(100% + 4px); left: 0; right: 0;
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 10px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 200;
      box-shadow: 0 8px 24px rgba(0,0,0,.5);
    }
    .picker-item {
      padding: 10px 14px;
      cursor: pointer;
      border-bottom: 1px solid #333;
      transition: background .1s;
    }
    .picker-item:last-child { border-bottom: none; }
    .picker-item:hover { background: rgba(255,255,255,.05); }
    .picker-item.is-selected { background: rgba(34,197,94,.1); }
    .picker-item.is-admin { opacity: .5; cursor: not-allowed; }
    .picker-name { font-size: 13px; font-weight: 600; color: #fff; }
    .picker-meta { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .picker-empty { padding: 14px; text-align: center; color: #6b7280; font-size: 13px; }
    .picker-loading { padding: 14px; text-align: center; color: #9ca3af; font-size: 13px; }
    .selected-hint {
      font-size: 12px;
      margin-top: 6px;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(34,197,94,.1);
      border: 1px solid rgba(34,197,94,.2);
      color: #4ade80;
      display: none;
    }
    .admin-name { font-weight: 600; color: #e5e7eb; font-size: 13px; }

    /* 權限警告 */
    .access-denied {
      text-align: center;
      padding: 60px 20px;
    }
    .access-denied-icon { font-size: 64px; margin-bottom: 16px; }
    .access-denied-title { font-size: 20px; font-weight: 700; color: #ef4444; margin-bottom: 8px; }
    .access-denied-text { color: #9ca3af; font-size: 14px; margin-bottom: 24px; }
  </style>
  <script src="supabase.min.js"></script>
  <script src="cloud.js?v=20260610a"></script>
</head>
<body>

<h1>⚙️ 企業管理員設定</h1>
<p class="subtitle">管理各公司的管理員權限，設定誰可以管理哪些公司的名片</p>

<div class="toolbar">
  <button class="btn btn-outline" onclick="location.href='admin.html'">← 返回管理後台</button>
  <button class="btn btn-green" onclick="reloadData()">重新整理</button>
</div>

<!-- 權限不足時顯示 -->
<div id="accessDenied" class="access-denied" style="display:none;">
  <div class="access-denied-icon">🔒</div>
  <div class="access-denied-title">權限不足</div>
  <div class="access-denied-text">只有超級管理員可以管理企業管理員設定</div>
  <button class="btn btn-outline" onclick="location.href='admin.html'">返回管理後台</button>
</div>

<!-- 主要內容 -->
<div id="mainContent" style="display:none;">
  
  <!-- 統計卡片 -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-card">
      <div class="stat-icon">👥</div>
      <div class="stat-value" id="statTotal">-</div>
      <div class="stat-label">總管理員數</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">👑</div>
      <div class="stat-value" id="statSuper">-</div>
      <div class="stat-label">超級管理員</div>
    </div>
    <div class="stat-card">
      <div class="stat-icon">🏢</div>
      <div class="stat-value" id="statCompany">-</div>
      <div class="stat-label">企業管理員</div>
    </div>
  </div>
  
  <!-- 新增管理員 -->
  <div class="section">
    <div class="section-title">➕ 新增管理員</div>
    <div id="addFormMsg"></div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">選擇用戶 *</label>
        <div class="user-picker" id="userPickerWrap">
          <input type="text" class="form-input" id="pickerSearch"
                 placeholder="輸入姓名、公司、職稱搜尋…"
                 oninput="onPickerInput()"
                 onfocus="openPicker()"
                 onblur="closePicker()"
                 autocomplete="off">
          <div class="user-picker-dropdown" id="pickerDropdown" style="display:none">
            <div class="picker-loading" id="pickerLoading">載入人員中…</div>
          </div>
        </div>
        <div class="selected-hint" id="selectedHint"></div>
      </div>
      <div class="form-group">
        <label class="form-label">管理公司</label>
        <input type="text" class="form-input" id="newAdminCompany" placeholder="例如：葡眾企業">
        <div class="form-hint">留空 = 超級管理員（可管理所有公司）</div>
      </div>
    </div>
    <button class="btn btn-green" onclick="addAdmin()" style="margin-top:8px;">
      新增管理員
    </button>
  </div>
  
  <!-- 現有管理員列表 -->
  <div class="section">
    <div class="section-title">📋 現有管理員</div>
    <div id="adminListMsg"></div>
    <div id="adminList" class="admin-list">
      <div class="loading">載入中...</div>
    </div>
  </div>
  
</div>

<script>
let allAdmins     = [];
let cardNameCache = {};    // user_id → { name, title, company }（搜尋後快取）
let isSuperAdmin  = false; // true = 超管，可管所有公司
let myCompany     = null;  // 企業管理員的公司名稱（超管時為 null）
let selectedUserId = '';
let pickerTimer   = null;

/* ── 頁面初始化 ────────────────────────── */
async function init() {
  if (!window.UVACO_CLOUD || !UVACO_CLOUD.hasConfig()) {
    showError('系統尚未設定，請先設定 cloud.js');
    return;
  }
  try {
    const adminStatus = await UVACO_CLOUD.isAdmin();

    // 超級管理員 或 企業管理員 皆可進入此頁面
    if (!adminStatus || !adminStatus.isAdmin) {
      document.getElementById('accessDenied').style.display = 'block';
      return;
    }

    isSuperAdmin = adminStatus.canManageAdmins && !adminStatus.managedCompany;
    myCompany    = adminStatus.managedCompany || null;

    // 企業管理員：鎖定「管理公司」欄位
    if (myCompany) {
      const companyInput = document.getElementById('newAdminCompany');
      companyInput.value    = myCompany;
      companyInput.readOnly = true;
      companyInput.style.opacity = '0.6';
      companyInput.style.cursor  = 'not-allowed';
      // 顯示說明文字
      const hint = companyInput.closest('.form-group')?.querySelector('.form-hint');
      if (hint) hint.textContent = '企業管理員只能新增本公司的管理員';
    }

    // 非管理員（既非超管也非企業管理員，不應發生，但防禦）
    if (!isSuperAdmin && !myCompany) {
      document.getElementById('accessDenied').style.display = 'block';
      return;
    }

    document.getElementById('mainContent').style.display = 'block';
    await reloadData();
  } catch (e) {
    console.error('初始化失敗:', e);
    showError('載入失敗：' + (e.message || e));
  }
}

/* ── 重新載入 ──────────────────────────── */
async function reloadData() {
  try {
    document.getElementById('adminList').innerHTML = '<div class="loading">載入中...</div>';
    const admResult = await UVACO_CLOUD.getAdminUsers();
    allAdmins = admResult.rows || [];
    updateStats();
    renderAdminList();
  } catch (e) {
    console.error('載入失敗:', e);
    showListError('載入失敗：' + (e.message || e));
  }
}

/* ── 統計 ──────────────────────────────── */
function updateStats() {
  document.getElementById('statTotal').textContent   = allAdmins.length;
  // 企業管理員模式：統計欄只顯示本公司管理員數，超管欄隱藏
  if (myCompany) {
    document.getElementById('statSuper').textContent   = '—';
    document.getElementById('statCompany').textContent = allAdmins.length;
  } else {
    document.getElementById('statSuper').textContent   = allAdmins.filter(a => !a.target_company).length;
    document.getElementById('statCompany').textContent = allAdmins.filter(a =>  a.target_company).length;
  }
}

/* ── 渲染管理員列表（顯示姓名）──────────── */
function renderAdminList() {
  const container = document.getElementById('adminList');
  if (!allAdmins.length) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-state-icon">👤</div>
        <div class="empty-state-text">尚未設定任何管理員</div>
      </div>`;
    return;
  }
  const sorted = [...allAdmins].sort((a, b) => {
    if (!a.target_company && b.target_company) return -1;
    if ( a.target_company && !b.target_company) return  1;
    return (a.target_company || '').localeCompare(b.target_company || '');
  });
  container.innerHTML = sorted.map(admin => {
    const isSuper   = !admin.target_company;
    const typeClass = isSuper ? 'super' : 'company';
    const typeIcon  = isSuper ? '👑' : '🏢';
    const typeLabel = isSuper ? '超級管理員' : esc(admin.target_company);
    const userId    = admin.user_id || '';
    const shortId   = userId.length > 20
      ? userId.slice(0, 8) + '…' + userId.slice(-8)
      : userId;
    // 從快取查姓名（搜尋過才有，否則不顯示）
    const card = cardNameCache[userId];
    const displayName = card ? esc(card.name || '（未填姓名）') : '';

    return `<div class="admin-item">
      <div class="admin-info">
        <div class="admin-type ${typeClass}">${typeIcon} ${typeLabel}</div>
        ${displayName ? `<div class="admin-name">${displayName}</div>` : ''}
        <div class="admin-userid" title="${userId}">${shortId}</div>
      </div>
      <div class="admin-actions">
        <button class="btn btn-outline" onclick="editAdmin('${userId}','${(admin.target_company||'').replace(/'/g,"\\'")}')">編輯</button>
        <button class="btn btn-red" onclick="deleteAdmin('${userId}')">刪除</button>
      </div>
    </div>`;
  }).join('');
}

/* ── 人員選擇器（資料來源：通訊錄 searchCards）── */

// 使用 searchCards 查詢（與通訊錄邏輯一致），並快取結果供管理員列表顯示姓名
async function fetchPickerCards(q) {
  try {
    const result = await UVACO_CLOUD.searchCards({ q: q || '', limit: 80 });
    const cards = result.rows || [];
    cards.forEach(c => { cardNameCache[c.user_id] = c; });
    return cards;
  } catch (e) {
    console.error('搜尋失敗:', e);
    return [];
  }
}

function renderPickerList(cards) {
  const dropdown = document.getElementById('pickerDropdown');
  if (!dropdown) return;

  if (!cards.length) {
    dropdown.innerHTML = '<div class="picker-empty">找不到符合的人員</div>';
    return;
  }

  const adminIds = new Set(allAdmins.map(a => a.user_id));
  dropdown.innerHTML = cards.map(c => {
    const isAlreadyAdmin = adminIds.has(c.user_id);
    const meta = [c.title, c.company].filter(Boolean).join(' · ');
    const cls  = [
      'picker-item',
      c.user_id === selectedUserId ? 'is-selected' : '',
      isAlreadyAdmin ? 'is-admin' : ''
    ].join(' ').trim();
    const badge = isAlreadyAdmin ? ' <span style="font-size:10px;color:#f59e0b">（已是管理員）</span>' : '';
    return `<div class="${cls}" onmousedown="pickUser('${c.user_id}')">
      <div class="picker-name">${esc(c.name || '（未填姓名）')}${badge}</div>
      ${meta ? `<div class="picker-meta">${esc(meta)}</div>` : ''}
    </div>`;
  }).join('');
}

function onPickerInput() {
  const q = document.getElementById('pickerSearch').value;
  if (selectedUserId) {
    selectedUserId = '';
    document.getElementById('selectedHint').style.display = 'none';
  }
  const dropdown = document.getElementById('pickerDropdown');
  dropdown.style.display = 'block';
  dropdown.innerHTML = '<div class="picker-loading">搜尋中…</div>';

  clearTimeout(pickerTimer);
  pickerTimer = setTimeout(async () => {
    const cards = await fetchPickerCards(q);
    renderPickerList(cards);
  }, 300);  // 等停止輸入 300ms 再查詢
}

async function openPicker() {
  const dropdown = document.getElementById('pickerDropdown');
  dropdown.style.display = 'block';
  const q = document.getElementById('pickerSearch').value;
  if (!q) {
    dropdown.innerHTML = '<div class="picker-loading">載入通訊錄…</div>';
    const cards = await fetchPickerCards('');
    renderPickerList(cards);
  }
}

function closePicker() {
  clearTimeout(pickerTimer);
  setTimeout(() => {
    document.getElementById('pickerDropdown').style.display = 'none';
  }, 180);
}

function pickUser(userId) {
  if (allAdmins.some(a => a.user_id === userId)) {
    showFormError('此用戶已是管理員');
    return;
  }
  selectedUserId = userId;
  const card = cardNameCache[userId];
  const displayName = card?.name || userId;
  document.getElementById('pickerSearch').value = displayName;
  const hint = document.getElementById('selectedHint');
  hint.textContent = `✓ ${displayName}（ID: ${userId.slice(0,8)}…）`;
  hint.style.display = 'block';
  document.getElementById('pickerDropdown').style.display = 'none';
}

/* ── 新增管理員 ────────────────────────── */
async function addAdmin() {
  if (!selectedUserId) {
    showFormError('請先從清單選擇一位用戶');
    return;
  }
  if (allAdmins.some(a => a.user_id === selectedUserId)) {
    showFormError('此用戶已是管理員');
    return;
  }
  // 企業管理員：強制使用自己的公司，不接受表單輸入
  const company = myCompany || document.getElementById('newAdminCompany').value.trim() || null;

  // 超管新增另一位超管（公司留空）只有超管自己才能做
  if (!company && !isSuperAdmin) {
    showFormError('企業管理員只能新增本公司的管理員，請填寫管理公司');
    return;
  }

  try {
    await UVACO_CLOUD.upsertAdminUser(selectedUserId, company);
    showFormSuccess('管理員新增成功！');
    // 重置選擇器
    selectedUserId = '';
    document.getElementById('pickerSearch').value = '';
    document.getElementById('selectedHint').style.display = 'none';
    if (!myCompany) document.getElementById('newAdminCompany').value = ''; // 超管才清空
    await reloadData();
  } catch (e) {
    console.error('新增管理員失敗:', e);
    showFormError('新增失敗：' + (e.message || e));
  }
}

// 編輯管理員
function editAdmin(userId, currentCompany) {
  const newCompany = prompt(
    '編輯管理員權限\n\n' +
    '輸入要管理的公司名稱：\n' +
    '（留空 = 超級管理員，可管理所有公司）',
    currentCompany || ''
  );
  
  if (newCompany === null) return; // 取消
  
  updateAdminCompany(userId, newCompany.trim() || null);
}

// 更新管理員公司
async function updateAdminCompany(userId, company) {
  try {
    const result = await UVACO_CLOUD.upsertAdminUser(userId, company);
    if (result.error) {
      throw new Error(result.error.message || '更新失敗');
    }
    
    alert('管理員權限已更新');
    await reloadData();
  } catch (e) {
    console.error('更新管理員失敗:', e);
    alert('更新失敗：' + (e.message || e));
  }
}

// 刪除管理員
async function deleteAdmin(userId) {
  if (!confirm('確定要移除此管理員權限？\n\n此操作無法復原。')) {
    return;
  }
  
  try {
    const result = await UVACO_CLOUD.deleteAdminUser(userId);
    if (result.error) {
      throw new Error(result.error.message || '刪除失敗');
    }
    
    alert('管理員已移除');
    await reloadData();
  } catch (e) {
    console.error('刪除管理員失敗:', e);
    alert('刪除失敗：' + (e.message || e));
  }
}

// HTML 跳脫（防 XSS）
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 顯示表單錯誤
function showFormError(msg) {
  const el = document.getElementById('addFormMsg');
  el.innerHTML = `<div class="error-msg">${msg}</div>`;
  setTimeout(() => { el.innerHTML = ''; }, 5000);
}

// 顯示表單成功
function showFormSuccess(msg) {
  const el = document.getElementById('addFormMsg');
  el.innerHTML = `<div class="success-msg">${msg}</div>`;
  setTimeout(() => { el.innerHTML = ''; }, 3000);
}

// 顯示列表錯誤
function showListError(msg) {
  const el = document.getElementById('adminListMsg');
  el.innerHTML = `<div class="error-msg">${msg}</div>`;
}

// 顯示全域錯誤
function showError(msg) {
  document.getElementById('mainContent').innerHTML = `
    <div class="error-msg" style="margin-top: 20px;">${msg}</div>
    <button class="btn btn-outline" onclick="location.href='admin.html'" style="margin-top: 12px;">返回管理後台</button>
  `;
  document.getElementById('mainContent').style.display = 'block';
}

// 頁面載入
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>

<script>
// 前往「我的名片」頁面
async function gotoMyCard(event) {
  if (event) {
    event.preventDefault();
    event.stopPropagation();
  }
  try {
    if (!window.UVACO_CLOUD || !UVACO_CLOUD.hasConfig()) {
      window.location.href = 'auth.html?next=company-admin.html';
      return false;
    }
    const s = await UVACO_CLOUD.getSession();
    const uid = s && s.session && s.session.user ? String(s.session.user.id || '').trim() : '';
    if (!uid) {
      window.location.href = 'auth.html?next=company-admin.html';
      return false;
    }
    window.location.href = 'card.html?id=' + encodeURIComponent(uid);
    return false;
  } catch (e) {
    window.location.href = 'auth.html?next=company-admin.html';
    return false;
  }
}
</script>
