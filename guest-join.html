<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>建立電子名片</title>
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="stylesheet" href="styles.css?v=20260610a">
  <meta name="theme-color" content="#22c55e">
  <script src="supabase.min.js"></script>
  <script src="cloud.js?v=20260804e"></script>
  <style>
    body {
      min-height: 100vh;
      padding: 24px 16px 40px;
    }
    .join-shell {
      width: min(760px, 100%);
      margin: 0 auto;
    }
    .join-header {
      margin: 34px 0 22px;
      text-align: center;
    }
    .join-logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 16px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: rgba(34, 197, 94, 0.14);
      border: 1px solid rgba(34, 197, 94, 0.28);
    }
    .join-logo img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    .join-title {
      margin: 0 0 10px;
      font-size: clamp(28px, 7vw, 44px);
      line-height: 1.12;
      letter-spacing: 0;
    }
    .join-desc {
      margin: 0 auto;
      max-width: 560px;
      color: #a7b0bf;
      font-size: 15px;
      line-height: 1.8;
    }
    .join-panel {
      background: rgba(17, 24, 39, 0.84);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.28);
      padding: 22px;
    }
    .join-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }
    .join-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .join-field.full {
      grid-column: 1 / -1;
    }
    .join-label {
      font-size: 13px;
      font-weight: 700;
      color: #d7dde8;
    }
    .join-input {
      width: 100%;
      min-height: 46px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      padding: 11px 13px;
      font-size: 16px;
      outline: none;
    }
    .join-input:focus {
      border-color: rgba(34, 197, 94, 0.8);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.16);
    }
    .join-input::placeholder {
      color: #6b7280;
    }
    .join-note {
      margin: 16px 0 0;
      color: #9ca3af;
      font-size: 13px;
      line-height: 1.7;
    }
    .join-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .join-btn {
      min-height: 46px;
      border: 0;
      border-radius: 8px;
      padding: 11px 18px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .join-btn:active {
      transform: translateY(1px);
    }
    .join-btn.primary {
      flex: 1 1 220px;
      color: #fff;
      background: #1faf53;
    }
    .join-btn.secondary {
      color: #d1d5db;
      background: rgba(255, 255, 255, 0.1);
    }
    .join-btn:disabled {
      cursor: wait;
      opacity: 0.62;
    }
    .join-status {
      display: none;
      margin-top: 16px;
      border-radius: 8px;
      padding: 13px 14px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .join-status.show {
      display: block;
    }
    .join-status.ok {
      color: #dcfce7;
      background: rgba(34, 197, 94, 0.13);
      border: 1px solid rgba(34, 197, 94, 0.28);
    }
    .join-status.err {
      color: #fee2e2;
      background: rgba(239, 68, 68, 0.13);
      border: 1px solid rgba(239, 68, 68, 0.28);
    }
    .join-invite-summary {
      display: none;
      margin: 0 0 16px;
      border-radius: 8px;
      padding: 12px 14px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.24);
      color: #bbf7d0;
      font-size: 13px;
      line-height: 1.7;
    }
    .join-invite-summary.show {
      display: block;
    }
    .join-success {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-radius: 8px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.26);
    }
    .join-success.show {
      display: block;
    }
    .join-success-title {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 6px;
      font-size: 17px;
      font-weight: 800;
    }
    .join-success-icon {
      font-size: 20px;
      line-height: 1;
    }
    .join-success-hint {
      margin: 0 0 12px;
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.72);
    }
    .join-link {
      display: block;
      overflow-wrap: anywhere;
      color: #86efac;
      font-size: 13px;
      line-height: 1.6;
      margin-bottom: 12px;
    }
    .join-honeypot {
      position: absolute;
      left: -9999px;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
    @media (max-width: 640px) {
      body {
        padding: 14px 12px 28px;
      }
      .join-header {
        margin-top: 18px;
      }
      .join-panel {
        padding: 16px;
      }
      .join-grid {
        grid-template-columns: 1fr;
      }
      .join-actions {
        flex-direction: column;
      }
      .join-btn {
        width: 100%;
      }
    }
  </style>
</head>
<body class="theme-dark lang-zh">
  <div class="bg-blob blob1"></div>
  <div class="bg-blob blob2"></div>

  <main class="join-shell">
    <header class="join-header">
      <div class="join-logo">
        <img src="uvaco-logo.svg" alt="數位身分">
      </div>
      <h1 class="join-title">建立你的電子名片</h1>
      <p class="join-desc">不用 LINE、Google、Email 驗證碼或簡訊。填完資料送出後，系統會自動通過並建立公開名片。</p>
    </header>

    <section class="join-panel" id="joinPanel">
      <div id="inviteSummary" class="join-invite-summary"></div>
      <form id="guestJoinForm" novalidate>
        <div class="join-grid">
          <label class="join-field">
            <span class="join-label">姓名</span>
            <input class="join-input" id="guestName" name="name" type="text" autocomplete="name" maxlength="80" required placeholder="請輸入姓名">
          </label>

          <label class="join-field">
            <span class="join-label">職稱</span>
            <input class="join-input" id="guestTitle" name="title" type="text" autocomplete="organization-title" maxlength="80" placeholder="例如：業務經理">
          </label>

          <label class="join-field">
            <span class="join-label">公司</span>
            <input class="join-input" id="guestCompany" name="company" type="text" autocomplete="organization" maxlength="100" placeholder="請輸入公司名稱">
          </label>

          <label class="join-field">
            <span class="join-label">部門</span>
            <input class="join-input" id="guestDepartment" name="department" type="text" maxlength="80" placeholder="可留空">
          </label>

          <label class="join-field">
            <span class="join-label">電話</span>
            <input class="join-input" id="guestPhone" name="phone" type="tel" autocomplete="tel" maxlength="40" placeholder="手機或公司電話">
          </label>

          <label class="join-field">
            <span class="join-label">Email</span>
            <input class="join-input" id="guestEmail" name="email" type="email" autocomplete="email" maxlength="160" placeholder="可留空">
          </label>

          <label class="join-field full">
            <span class="join-label">LINE 或其他聯絡連結</span>
            <input class="join-input" id="guestLineUrl" name="line_url" type="url" inputmode="url" maxlength="220" placeholder="例如：https://line.me/R/ti/p/...">
          </label>

          <label class="join-honeypot">
            網站
            <input id="guestWebsite" name="website" type="text" tabindex="-1" autocomplete="off">
          </label>
        </div>

        <p class="join-note">至少填一種聯絡方式。送出後會立即產生公開名片；日後若要修改資料，請聯絡邀請你的人或管理員。</p>

        <div class="join-actions">
          <button class="join-btn primary" id="guestSubmitBtn" type="submit">送出並建立名片</button>
          <a class="join-btn secondary" href="index.html" style="text-decoration:none; text-align:center;">返回首頁</a>
        </div>

      </form>

      <div id="joinStatus" class="join-status" role="status"></div>

      <div id="joinSuccess" class="join-success">
        <p class="join-success-title"><span class="join-success-icon" id="joinSuccessIcon">✅</span><span id="joinSuccessTitle">名片已建立完成</span></p>
        <p class="join-success-hint" id="joinSuccessHint">點下面「開啟我的名片」就能看到你的專屬名片，記得把連結存起來。</p>
        <a id="guestCardLink" class="join-link" href="#" target="_blank" rel="noopener"></a>
        <div class="join-actions">
          <button type="button" class="join-btn primary" onclick="openCreatedCard()">開啟我的名片</button>
          <button type="button" class="join-btn secondary" onclick="copyCreatedCardLink()">複製名片連結</button>
        </div>
      </div>

      <p style="text-align:center; margin-top:18px; font-size:12px;">
        <a href="faq.html" style="color:#9ca3af; text-decoration:underline;">操作上有疑問？先看常見問題</a>
      </p>
    </section>
  </main>

  <script>
    var createdCardUrl = '';
    var createdShareUrl = '';
    var loadedInvite = null;

    function getParam(name) {
      try {
        return new URLSearchParams(window.location.search || '').get(name) || '';
      } catch (e) {
        return '';
      }
    }

    function setJoinStatus(type, message) {
      var box = document.getElementById('joinStatus');
      if (!box) return;
      box.className = 'join-status show ' + (type === 'ok' ? 'ok' : 'err');
      box.textContent = message;
    }

    function clearJoinStatus() {
      var box = document.getElementById('joinStatus');
      if (!box) return;
      box.className = 'join-status';
      box.textContent = '';
    }

    // 把後端回傳的技術錯誤代碼轉成白話文，原則比照 edit.html 的存檔錯誤提示：
    // 畫面上一律不直接顯示英文錯誤代碼，代碼只印到 console，方便你之後對照 Supabase 後台的 Logs 排查。
    function friendlyGuestJoinErrorMessage(errorCode) {
      var messages = {
        BOT_DETECTED: '這次送出被系統判斷為異常請求，請重新整理頁面後再試一次；如果一直發生，麻煩直接聯絡我們協助處理。',
        INVITE_INVALID_OR_EXPIRED: '這個邀請連結已經過期或已經被使用過了，請向邀請你的人索取新的連結。',
        INVITE_READ_FAILED: '讀取邀請資料時發生問題，請重新整理頁面後再試一次。',
        CARD_CREATE_FAILED: '名片建立時發生問題，不是你填寫的資料有錯，麻煩稍後再試一次；如果一直失敗，請聯絡我們協助處理。',
        MISSING_SUPABASE_SECRETS: '系統目前設定尚未完成，暫時無法建立名片，請聯絡我們協助處理。',
        METHOD_NOT_ALLOWED: '系統暫時發生問題，請重新整理頁面後再試一次。',
        INVALID_JSON: '系統暫時發生問題，請重新整理頁面後再試一次。'
      };
      return messages[errorCode] || '名片建立沒有成功，請稍後再試一次；如果一直不行，麻煩直接聯絡我們協助處理。';
    }

    function getInputValue(id) {
      var el = document.getElementById(id);
      return el ? String(el.value || '').trim() : '';
    }

    function setInputValue(id, value, lock) {
      var el = document.getElementById(id);
      if (!el || !value) return;
      el.value = value;
      if (lock) {
        el.readOnly = true;
        el.style.opacity = '0.72';
        el.style.cursor = 'not-allowed';
      }
    }

    function setSubmitting(isSubmitting) {
      var btn = document.getElementById('guestSubmitBtn');
      if (!btn) return;
      btn.disabled = isSubmitting;
      btn.textContent = isSubmitting ? '正在建立名片...' : '送出並建立名片';
    }

    function showSuccess(publicUrl, shareUrl, isDuplicate) {
      createdCardUrl = publicUrl || '';
      createdShareUrl = shareUrl || publicUrl || '';
      try {
        localStorage.setItem('UVACO_LAST_GUEST_CARD_URL', createdCardUrl);
        localStorage.setItem('UVACO_LAST_GUEST_CARD_SHARE_URL', createdShareUrl);
      } catch (e) {}

      // 電話或 Email 已經對應到現有名片時，後端不會新建一筆，這裡改用不同的圖示／標題／說明文字，
      // 讓使用者一眼就看出「這不是新建立的名片，是原本就有的那張」，並清楚知道下一步要按哪個按鈕。
      var icon = document.getElementById('joinSuccessIcon');
      var title = document.getElementById('joinSuccessTitle');
      var hint = document.getElementById('joinSuccessHint');
      if (icon) icon.textContent = isDuplicate ? '📇' : '✅';
      if (title) {
        title.textContent = isDuplicate
          ? '你已經有名片了'
          : '名片已建立完成';
      }
      if (hint) {
        hint.textContent = isDuplicate
          ? '系統找到你原本用這支電話或 Email 建立過的名片，不會重複建立。直接點下面「開啟我的名片」就能打開，不用再填一次資料。'
          : '點下面「開啟我的名片」就能看到你的專屬名片，記得把連結存起來。';
      }

      var link = document.getElementById('guestCardLink');
      if (link) {
        link.href = createdCardUrl;
        link.textContent = createdCardUrl;
      }
      var success = document.getElementById('joinSuccess');
      if (success) success.classList.add('show');
      var form = document.getElementById('guestJoinForm');
      if (form) form.style.display = 'none';
    }

    async function loadInviteDefaults() {
      var token = getParam('invite');
      if (!token) return;
      if (!window.UVACO_CLOUD || typeof UVACO_CLOUD.getCardInvitePublic !== 'function') return;

      try {
        var result = await UVACO_CLOUD.getCardInvitePublic(token);
        if (!result || !result.invite) {
          setJoinStatus('err', '這個邀請連結已過期或已使用，請向公司管理員重新索取。');
          return;
        }
        loadedInvite = result.invite;
        setInputValue('guestName', loadedInvite.name, false);
        setInputValue('guestTitle', loadedInvite.title, false);
        setInputValue('guestCompany', loadedInvite.company, true);
        setInputValue('guestDepartment', loadedInvite.department, false);
        setInputValue('guestPhone', loadedInvite.phone, false);
        setInputValue('guestEmail', loadedInvite.email, false);
        setInputValue('guestLineUrl', loadedInvite.line_url, false);

        var summary = document.getElementById('inviteSummary');
        if (summary) {
          summary.textContent = '公司已先幫你建立基本資料。請確認姓名、電話或 LINE 是否正確，再按下方按鈕建立名片。';
          summary.classList.add('show');
        }
      } catch (e) {
        setJoinStatus('err', '邀請資料載入失敗，請重新整理後再試一次。');
      }
    }

    function openCreatedCard() {
      if (createdCardUrl) window.location.href = createdCardUrl;
    }

    async function copyCreatedCardLink() {
      var url = createdShareUrl || createdCardUrl;
      if (!url) return;
      try {
        await navigator.clipboard.writeText(url);
        setJoinStatus('ok', '名片連結已複製。');
      } catch (e) {
        prompt('請手動複製名片連結：', url);
      }
    }

    document.getElementById('guestJoinForm').addEventListener('submit', async function(event) {
      event.preventDefault();
      clearJoinStatus();

      var name = getInputValue('guestName');
      var phone = getInputValue('guestPhone');
      var email = getInputValue('guestEmail');
      var lineUrl = getInputValue('guestLineUrl');

      if (!name) {
        setJoinStatus('err', '請先填寫姓名。');
        return;
      }
      if (!phone && !email && !lineUrl) {
        setJoinStatus('err', '請至少填寫電話、Email 或 LINE 聯絡連結其中一項。');
        return;
      }
      if (!window.UVACO_CLOUD || typeof UVACO_CLOUD.createGuestCardAutoApproved !== 'function') {
        setJoinStatus('err', '系統尚未載入完成，請重新整理後再試一次。');
        return;
      }

      setSubmitting(true);
      try {
        var result = await UVACO_CLOUD.createGuestCardAutoApproved({
          referrer_user_id: getParam('ref'),
          invite_token: getParam('invite'),
          name: name,
          title: getInputValue('guestTitle'),
          company: getInputValue('guestCompany'),
          department: getInputValue('guestDepartment'),
          phone: phone,
          email: email,
          line_url: lineUrl,
          phone_extension: loadedInvite && loadedInvite.phone_extension ? loadedInvite.phone_extension : '',
          company_address: loadedInvite && loadedInvite.company_address ? loadedInvite.company_address : '',
          website: getInputValue('guestWebsite')
        });

        if (!result || !result.success) {
          var error = result && result.error ? result.error : 'CREATE_FAILED';
          console.error('guest-card-intake failed:', error); // 技術代碼只留在 console，方便對照 Supabase Logs
          setJoinStatus('err', friendlyGuestJoinErrorMessage(error));
          return;
        }

        showSuccess(result.public_url, result.share_url, !!result.duplicate);
      } catch (e) {
        setJoinStatus('err', '名片建立失敗，請稍後再試。');
      } finally {
        setSubmitting(false);
      }
    });

    loadInviteDefaults();
  </script>
</body>
</html>
