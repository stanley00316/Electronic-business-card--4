# 掃這次 PR／push 帶進來的 commit 有沒有金鑰、token、密碼。
#
# 只掃範圍內的 commit，不掃整段歷史：歷史裡若有舊問題，另開任務處理，
# 不讓每個 PR 都因為兩年前的 commit 而紅。
# 用 gitleaks 的 CLI 二進位而不是 gitleaks-action：action 對組織 repo 要授權金鑰，CLI 是 MIT 免費。
# 本機的 ~/.claude/hooks/guard-secrets.sh 是第一道（擋 git add），這裡是第二道（伺服器端，繞不過）。

name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan commits in range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ -z "$BASE" ] || [ "$BASE" = "$ZERO" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "沒有可比對的起點（新分支或歷史被改寫），只掃 HEAD 一筆。"
            RANGE="$HEAD^..$HEAD"
          else
            RANGE="$BASE..$HEAD"
          fi
          echo "掃描範圍：$RANGE"
          gitleaks detect --source . --log-opts="$RANGE" --redact --verbose --exit-code 1
